name: Capture Squarespace site (one-time)

# Copies the live ddfcgi.com Squarespace pages, images and files into capture/squarespace/.
# Ran once in Nov 2026; can still be run by hand from the Actions tab.
on:
  workflow_dispatch:  # manual only: the one-time copy is done; ddfcgi.com no longer runs on Squarespace

permissions:
  contents: write

concurrency:
  group: capture-squarespace
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download pages, images and files
        run: python3 tools/capture_squarespace.py
      - name: Look for missing images in the Wayback Machine
        run: python3 tools/wayback_images.py
      - name: Commit the copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add capture/squarespace
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            git commit -m "Capture Squarespace pages, images and files"
            git push
          fi
