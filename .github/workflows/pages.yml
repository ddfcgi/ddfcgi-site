name: Publish to GitHub Pages (www.ddfcgi.com)

# GitHub Pages serves www.ddfcgi.com from the gh-pages branch (Settings > Pages > Deploy from a branch > gh-pages).
# This workflow rebuilds that branch from public/ whenever public/ changes on main, so every change to public/ goes
# live. It can also be run by hand from the Actions tab. Never edit gh-pages by hand: each run replaces it.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - public/**
      - .github/workflows/pages.yml

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy the site (without the Cloudflare-only files)
        run: |
          mkdir -p _pages-build
          cp -r public/. _pages-build/
          rm -f _pages-build/_headers _pages-build/_redirects
          echo "www.ddfcgi.com" > _pages-build/CNAME
          touch _pages-build/.nojekyll
      - name: Replace the gh-pages branch with the new copy
        working-directory: _pages-build
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7} from main"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
