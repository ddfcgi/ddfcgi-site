name: Publish to GitHub Pages (www.ddfcgi.com)

# GitHub Pages serves www.ddfcgi.com from the gh-pages branch (Settings > Pages > Deploy from a branch > gh-pages).
# This workflow rebuilds that branch from public/ whenever public/ changes on main, so every change to public/ goes
# live. It can also be run by hand from the Actions tab. Never edit gh-pages by hand: each run replaces it.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - public/**
      - .github/workflows/pages.yml

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy the site (without the Cloudflare-only files)
        run: |
          mkdir -p _pages-build
          cp -r public/. _pages-build/
          rm -f _pages-build/_headers _pages-build/_redirects
          echo "www.ddfcgi.com" > _pages-build/CNAME
          touch _pages-build/.nojekyll
      # A normal commit on top of gh-pages (not a fresh branch each time), so Cloudflare's build watch paths
      # see only the changed files and skip building this branch.
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _gh-pages
      - name: Commit the new copy to gh-pages
        working-directory: _gh-pages
        run: |
          rsync -a --delete --exclude .git ../_pages-build/ ./
          git add -A
          if git diff --cached --quiet; then echo "No changes to publish."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Publish ${GITHUB_SHA::7} from main"
          git push origin gh-pages
